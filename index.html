<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22383a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Метроника</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232b3a33%27/%3E%3Cpath d=%27M8 24V8h3l5 8 5-8h3v16h-3V14l-5 8-5-8v10z%27 fill=%27%23edf2e8%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@800&family=Onest:wght@500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
  <style>html,body{background:#22383a;margin:0}</style>
</head>
<body>
  <div class="app">
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <nav id="tabbar" class="tabbar" aria-label="Разделы" hidden></nav>
  <div id="drawer" class="drawer"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status"></div>
  <noscript>Для работы прототипа нужен включённый JavaScript.</noscript>
  <script>
    // Код грузим по ЖИВОМУ номеру сборки: оболочка может быть закэширована, но version.txt
    // спрашиваем мимо кэша и подключаем CSS и app.js уже с актуальным номером. Так старая
    // оболочка не может подтянуть старый код. V — запасной номер, если version.txt недоступен.
    (function () {
      var V = '560';
      function boot(v) {
        ['css/app.css', 'css/vyezdy.css', 'css/measurement.css'].forEach(function (href) {
          var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href + '?v=' + v; document.head.appendChild(l);
        });
        var s = document.createElement('script'); s.type = 'module'; s.src = 'js/app.js?v=' + v; document.body.appendChild(s);
      }
      fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (t) { t = (t || '').trim(); boot(t || V); })
        .catch(function () { boot(V); });
    })();
  </script>
</body>
</html>
