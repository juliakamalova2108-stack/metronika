<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22383a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Метроника</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=36" />
  <link rel="stylesheet" href="css/vyezdy.css?v=36" />
</head>
<body>
  <div class="app">
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <nav id="tabbar" class="tabbar" aria-label="Разделы" hidden></nav>
  <div id="drawer" class="drawer"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status"></div>
  <noscript>Для работы прототипа нужен включённый JavaScript.</noscript>
  <script type="module" src="js/app.js?v=36"></script>
  <script>
    // Телефон может держать старую страницу в памяти до 10 минут. Спрашиваем номер свежей версии
    // мимо памяти и, если он новее, один раз открываем страницу заново по чуть другому адресу.
    (function () {
      var V = '36';
      fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
        t = (t || '').trim();
        if (!t || t === V || new URLSearchParams(location.search).get('v') === t) return;
        location.replace(location.pathname + '?v=' + t + location.hash);
      }).catch(function () {});
    })();
  </script>
</body>
</html>
