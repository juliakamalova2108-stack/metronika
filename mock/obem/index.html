<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Одинаковый объём — варианты</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/vyezdy.css">
<style>
  .vs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; padding: 3px; border-radius: 8px; background: rgba(0,0,0,.28); }
  .vs button { flex: 1 0 calc(20% - 4px); height: 30px; border: 0; border-radius: 6px; background: none; color: rgba(237,240,231,.6); font: 600 11.5px/1 var(--font-body); cursor: pointer; }
  .vs button.is-on { background: #e6f2cc; color: #13292b; }
  .obh { margin: 0 2px 12px; font: 400 13px/18px var(--font-body); color: rgba(230,242,204,.8); }
  .rh { display: flex; align-items: center; gap: 10px; margin: 0 2px 12px; padding-left: 10px; border-left: 4px solid #f59e0b; }
  .rh b { display: block; font: 700 24px/28px var(--font-num); color: #edf0e7; } .rh small { font: 400 12px/15px var(--font-body); color: rgba(237,240,231,.65); }
  .rh .bt { margin-left: auto; display: flex; gap: 6px; }
  .ib { width: 46px; height: 46px; border-radius: 6px; display: grid; place-items: center; color: #e6f2cc; font: 300 28px/1 var(--font-body); border: 1px solid rgba(204,222,209,.55); background: #213839; box-shadow: 0 4px 7px rgba(4,13,15,.24), inset 0 -2px 2px rgba(6,18,20,.34), inset 0 1px 1px rgba(224,242,227,.36); cursor: pointer; padding: 0; }
  .num { font-family: var(--font-num); }
  input.big { border: 0; background: none; outline: none; color: inherit; font: inherit; width: 100%; text-align: inherit; padding: 0; }
  .blk { margin-bottom: 10px; }
  /* 1 экран */
  .v1 { display: flex; align-items: center; gap: 12px; height: 78px; padding: 0 12px 0 16px; border-radius: 10px; border: .9px solid rgba(6,18,20,.78); background: linear-gradient(180deg, #687b7a, #738582);
    box-shadow: inset 0 -1.2px 1.4px rgba(217,237,207,.33), inset 1px 1.5px 1.8px rgba(1,6,9,.58), inset 0 4px 7px rgba(1,9,11,.66); }
  .v1 .l { font: 500 13px/16px var(--font-body); color: #13292b; width: 90px; } .v1 .n { flex: 1; text-align: right; font: 700 38px/1 var(--font-num); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .v1 .u { font: 600 16px/1 var(--font-body); color: rgba(255,255,255,.8); margin-right: 4px; }
  /* 2 стекло */
  .v2 { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.35); }
  .v2::before { content: ''; position: absolute; z-index: -1; width: 160px; height: 160px; left: -40px; top: -60px; border-radius: 50%; background: #f59e0b; filter: blur(40px); opacity: .55; }
  .v2 .n { display: flex; align-items: baseline; gap: 4px; width: 120px; font: 700 40px/1 var(--font-num); color: #fff; } .v2 .n small { font-size: 16px; opacity: .75; }
  .v2 .r { flex: 1; } .v2 .r b { display: block; font: 600 15px/19px var(--font-body); color: #fff; }
  .pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(60,143,95,.9); color: #fff; font: 600 12px/1 var(--font-body); border: 0; cursor: pointer; }
  .pill.off { background: rgba(255,255,255,.12); color: rgba(255,255,255,.7); }
  /* 3 в шапке */
  .v3 { display: flex; align-items: baseline; gap: 10px; margin: -4px 2px 14px 16px; }
  .v3 .n { font: 700 44px/1 var(--font-num); color: #fff; border-bottom: 2px dashed rgba(230,242,204,.6); width: 110px; } .v3 .u { font: 600 18px/1 var(--font-body); color: rgba(255,255,255,.75); }
  .v3 small { font: 400 13px/16px var(--font-body); color: rgba(230,242,204,.85); }
  /* 4 шаг */
  .v4 { text-align: center; padding: 24px 18px; }
  .v4 p { margin: 0 0 14px; font: 600 19px/24px var(--font-body); color: #edf0e7; } .v4 .q { margin: 0 auto 8px; width: 200px; height: 74px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: .9px solid rgba(6,18,20,.78);
    background: linear-gradient(180deg, #687b7a, #738582); box-shadow: inset 1px 1.5px 1.8px rgba(1,6,9,.58), inset 0 4px 7px rgba(1,9,11,.66); font: 700 36px/1 var(--font-num); color: #fff; }
  .v4 small { display: block; margin-bottom: 14px; font: 400 13px/18px var(--font-body); color: rgba(237,240,231,.6); }
  /* 5 кольцо */
  .v5 { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 22px; padding: 16px; }
  .v5 .dial { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#f59e0b var(--p), rgba(237,240,231,.12) 0); box-shadow: 0 0 22px rgba(245,158,11,.25); }
  .v5 .dial div { width: 112px; height: 112px; border-radius: 50%; background: #213536; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .v5 .dial b { font: 700 36px/1 var(--font-num); color: #fff; } .v5 .dial small { font: 400 11px/14px var(--font-body); color: rgba(237,240,231,.65); margin-top: 4px; }
  .rb { width: 52px; height: 52px; border-radius: 50%; font: 300 30px/1 var(--font-body); color: #e6f2cc; border: 1px solid rgba(204,222,209,.55); background: #213839; box-shadow: 0 4px 7px rgba(4,13,15,.3), inset 0 1px 1px rgba(224,242,227,.36); cursor: pointer; }
  /* 6 линейка */
  .v6 { padding: 14px 14px 10px; } .v6 .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; } .v6 .top span { font: 500 13px/16px var(--font-body); color: rgba(237,240,231,.7); } .v6 .top b { font: 700 32px/1 var(--font-num); color: #fff; }
  .v6 .ruler { position: relative; height: 46px; border-radius: 8px; background-color: #c9d4bf; background-image: repeating-linear-gradient(90deg, rgba(19,41,43,.5) 0 1px, transparent 1px 6.6px), repeating-linear-gradient(90deg, rgba(19,41,43,.85) 0 2px, transparent 2px 33px); background-size: auto 12px, auto 20px; background-repeat: repeat-x; overflow: hidden; }
  .v6 input[type=range] { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; } .v6 .mark { position: absolute; top: 0; bottom: 0; width: 3px; background: #e5484d; left: var(--x); pointer-events: none; box-shadow: 0 0 6px #e5484d; }
  .v6 .sc { display: flex; justify-content: space-between; font: 500 10px/14px var(--font-num); color: rgba(237,240,231,.55); margin-top: 3px; }
  /* 7 липкая полоса */
  .v7 { position: sticky; top: 8px; z-index: 5; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 16px; border-radius: 28px; background: #213839; border: 1.5px solid #f59e0b; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
  .v7 span { flex: 1; font: 600 14px/18px var(--font-body); color: #edf0e7; } .v7 .f { width: 110px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 14px; background: #f59e0b; color: #13292b; font: 700 22px/1 var(--font-num); }
  .v7 .f input { text-align: right; } .v7 .f small { font-size: 13px; }
  /* 8 быстрые значения */
  .v8 { padding: 12px; } .v8 .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .v8 .row span { flex: 1; font: 600 15px/19px var(--font-body); color: #edf0e7; }
  .v8 .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } .v8 .chips button { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid rgba(204,222,209,.4); background: #213839; color: #edf0e7; font: 600 14px/1 var(--font-num); cursor: pointer; }
  .v8 .chips button.on { background: #f59e0b; color: #13292b; border-color: #f59e0b; }
  /* 9 периметр × высота */
  .v9 { padding: 12px; } .v9 p { margin: 0 4px 8px; font: 600 14px/18px var(--font-body); color: #edf0e7; }
  .v9 .f { display: grid; grid-template-columns: 1fr auto 1fr auto 1.2fr; gap: 6px; align-items: center; }
  .v9 .cell { height: 58px; border-radius: 8px; border: .9px solid rgba(6,18,20,.78); background: linear-gradient(180deg, #687b7a, #738582); box-shadow: inset 1px 1.5px 1.8px rgba(1,6,9,.58), inset 0 4px 7px rgba(1,9,11,.66); display: flex; flex-direction: column; justify-content: center; padding: 0 10px; }
  .v9 .cell small { font: 500 10px/12px var(--font-body); color: #13292b; } .v9 .cell input { font: 700 20px/1 var(--font-num); color: #fff; }
  .v9 .op { font: 600 18px/1 var(--font-body); color: rgba(237,240,231,.7); } .v9 .res { background: #2d4a3a; border-color: rgba(222,237,194,.7); } .v9 .res small { color: rgba(230,242,204,.8); } .v9 .res b { font: 700 20px/1 var(--font-num); color: #e6f2cc; }
  /* 10 скоба */
  .v10 { display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
  .v10 .br { position: relative; border-radius: 14px 0 0 14px; border: 3px solid #f59e0b; border-right: 0; margin: 10px 0; }
  .v10 .bub { position: absolute; left: -2px; top: 50%; transform: translateY(-50%); width: 70px; height: 70px; border-radius: 50%; background: #f59e0b; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #13292b; box-shadow: 0 0 16px rgba(245,158,11,.5); }
  .v10 .bub input { font: 700 24px/1 var(--font-num); text-align: center; width: 56px; } .v10 .bub small { font: 600 10px/12px var(--font-body); }
  .v10 .o-room { margin: 0; }
.v2 .n input { width: 70px; } .v3 .n { width: 84px; } .v3 { align-items: center; } .v5 .dial b input { text-align: center; width: 90px; } .v4 .q input { width: 90px; text-align: center; }
</style></head>
<body class="fig"><div class="app"><main id="view" class="view"></main></div>
<script>
const NAV = `<nav class="f-nav f-nav--tabs" aria-label="Нижнее меню">
    <button type="button" class="f-nav__tab f-nav__menu" data-action="menu-open"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="2" rx="1" fill="#A3AEBE"></rect><rect x="3" y="10" width="18" height="2" rx="1" fill="#A3AEBE"></rect><rect x="3" y="15" width="18" height="2" rx="1" fill="#A3AEBE"></rect></svg><span>Меню</span></button>
    <div class="f-topnav f-botnav"><div class="f-topnav__track" role="tablist"><button type="button" role="tab" aria-selected="false" class="f-tab" data-action="f-tab" data-tab="channel">Канал</button><button type="button" role="tab" aria-selected="false" class="f-tab" data-action="f-tab" data-tab="client">Клиент</button><button type="button" role="tab" aria-selected="true" class="f-tab is-active" data-action="f-tab" data-tab="estimate">Оценка</button><button type="button" role="tab" aria-selected="false" class="f-tab" data-action="f-tab" data-tab="schedule">График</button></div></div>
  </nav>`;
const SV = [['Грунтовка стен', 100], ['Поклейка флиз. обоев', 330], ['Демонтаж обоев', 150]];
let V = 1, val = 18, all = true;
const fmt = (n) => Math.round(n).toLocaleString('ru-RU');
const NAMES = ['Экран', 'Стекло', 'В шапке', 'Шаг', 'Кольцо', 'Линейка', 'Липкая', 'Быстрые', 'Стены', 'Скоба'];
const HINTS = {
  1: 'Экран как у калькулятора: светлое утопленное поле во всю ширину, крупные цифры справа, в углу — калькулятор.',
  2: 'Стеклянная карточка с пятном цвета комнаты, крупные цифры, таблетка «✓ во все работы» вместо переключателя.',
  3: 'Без отдельного блока: крупная цифра прямо под названием комнаты, как её площадь. Нажал на цифру — ввод.',
  4: 'Отдельный шаг: сразу после выбора комнаты — «Сколько м² стен?», потом работы уже с этим объёмом.',
  5: 'Кольцо-счётчик: цифра в круге, по бокам «−» и «+» (по 1 м²), нажал на цифру — ввод с клавиатуры.',
  6: 'Линейка-рулетка: тянешь пальцем по ленте с делениями, красная риска — значение. Подходит к теме замеров.',
  7: 'Липкая полоса: узкая цветная капсула, которая едет за тобой при прокрутке — объём всегда на виду.',
  8: 'Быстрые значения: поле и под ним частые объёмы кнопками (10, 15, 20…). Нажал — подставилось.',
  9: 'Стены: периметр × высота = площадь. Вводишь размеры комнаты, площадь стен считается сама и идёт во все работы.',
  10: 'Скоба: цветная скобка слева охватывает все работы, на ней кружок с объёмом — видно, что он льётся во все строки.',
};
function rows(locked) { return `<section class="f-plate o-room o-room--rows">${SV.map(([n, p]) => `<div class="o-svc"><label class="o-qty is-locked"><input value="${val || ''}" placeholder="—" readonly><span>м²</span></label><span class="o-svc__t"><span class="o-svc__n">${n}</span><small>${p} ₽/м²</small></span><b class="o-svc__s">${val ? fmt(val * p) + ' ₽' : ''}</b></div>`).join('')}</section>`; }
const inp = (cls = 'big') => `<input class="${cls}" inputmode="decimal" value="${val || ''}" placeholder="—" oninput="setV(this.value)">`;
const CALC = '<span class="o-calc-ico" aria-hidden="true"><i></i><b></b><b></b><b></b><b></b></span>';
function block() {
  switch (V) {
    case 1: return `<div class="v1 blk"><span class="l">Объём на все работы</span><span class="n">${inp()}</span><span class="u">м²</span><button class="ib">${CALC}</button></div>`;
    case 2: return `<div class="v2 blk"><span class="n">${inp()}<small>м²</small></span><span class="r"><b>Одинаковый объём</b><button class="pill${all ? '' : ' off'}" onclick="all=!all;draw()">${all ? '✓ во все работы' : 'каждая отдельно'}</button></span></div>`;
    case 4: return '';
    case 5: return `<section class="f-plate v5 blk"><button class="rb" onclick="val=Math.max(0,val-1);draw()">−</button><div class="dial" style="--p:${Math.min(100, val / 50 * 100)}%"><div><b>${inp()}</b><small>м² во все работы</small></div></div><button class="rb" onclick="val=val+1;draw()">+</button></section>`;
    case 6: return `<section class="f-plate v6 blk"><div class="top"><span>Объём на все работы</span><b>${val} м²</b></div><div class="ruler"><i class="mark" style="--x:${val / 60 * 100}%"></i><input type="range" min="0" max="60" step="0.5" value="${val}" oninput="val=+this.value;draw()"></div><div class="sc"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span></div></section>`;
    case 7: return `<div class="v7 blk"><span>Объём на все работы</span><span class="f">${inp()}<small>м²</small></span></div>`;
    case 8: return `<section class="f-plate v8 blk"><div class="row"><span>Одинаковый объём</span><label class="o-qty"><input inputmode="decimal" value="${val || ''}" placeholder="—" oninput="setV(this.value)"><span>м²</span></label></div><div class="chips">${[10, 12, 15, 18, 20, 25, 30, 40].map((x) => `<button class="${x == val ? 'on' : ''}" onclick="val=${x};draw()">${x} м²</button>`).join('')}</div></section>`;
    case 9: { const [pp, hh] = (window.ph || [12, 2.7]); return `<section class="f-plate v9 blk"><p>Площадь стен — во все работы</p><div class="f"><label class="cell"><small>Периметр, м</small><input class="big" inputmode="decimal" value="${pp}" oninput="ph=[+this.value.replace(',','.')||0,(window.ph||[12,2.7])[1]];val=Math.round(ph[0]*ph[1]*10)/10;upd()"></label><span class="op">×</span><label class="cell"><small>Высота, м</small><input class="big" inputmode="decimal" value="${String(hh).replace('.', ',')}" oninput="ph=[(window.ph||[12,2.7])[0],+this.value.replace(',','.')||0];val=Math.round(ph[0]*ph[1]*10)/10;upd()"></label><span class="op">=</span><div class="cell res"><small>Стены, м²</small><b id="r9">${String(val).replace('.', ',')}</b></div></div></section>`; }
    default: return '';
  }
}
function body() {
  const head = `<div class="rh"><span><b>Гостиная</b><small>1 этаж</small></span><span class="bt"><button class="ib">+</button><button class="ib">${CALC}</button></span></div>`;
  if (V === 3) return `${head}<div class="v3"><span class="n">${inp()}</span><span class="u">м²</span><small>для всех работ ✎</small></div>${rows()}`;
  if (V === 4) return `${head}<section class="f-plate v4"><p>Сколько м² стен в гостиной?</p><div class="q">${inp()}<span style="font-size:18px;opacity:.8">м²</span></div><small>Этот объём подставится во все работы — потом любую можно поправить</small><div class="f-btn-row" style="width:calc(50% + 2.5px);margin:0 auto"><button class="f-btn">Дальше — работы</button></div></section>`;
  if (V === 10) return `${head}<div class="v10"><div class="br"><div class="bub">${inp()}<small>м²</small></div></div>${rows()}</div>`;
  return `${head}${block()}${rows()}`;
}
function draw() {
  document.getElementById('view').innerHTML = `<div class="fig-blobs" aria-hidden="true"><i></i><i></i></div><div class="o-wrap"><div class="vs">${NAMES.map((n, i) => `<button class="${V === i + 1 ? 'is-on' : ''}" onclick="V=${i + 1};draw()">${n}</button>`).join('')}</div><p class="obh">${V}. ${HINTS[V]}</p>${body()}
    <section class="o-card o-total" style="margin-top:10px"><div class="o-card__head"><span>Итог комнаты</span></div><div class="o-tiles"><div class="o-tile"><small>Стоимость</small><b id="tot">${fmt(val * 580)} ₽</b></div><div class="o-tile"><small>Срок</small><b>1 день 2 ч</b></div></div></section>
    <div class="f-btn-row" style="width:calc(50% + 2.5px);margin:12px auto"><button class="f-btn">Сохранить</button></div><div style="height:${V === 7 ? 400 : 0}px"></div></div>${NAV}`;
}
function setV(v) { val = parseFloat(String(v).replace(',', '.')) || 0; upd(); }
function upd() { document.querySelectorAll('.o-svc').forEach((r, i) => { r.querySelector('input').value = val || ''; r.querySelector('.o-svc__s').textContent = val ? fmt(val * SV[i][1]) + ' ₽' : ''; });
  const t = document.getElementById('tot'); if (t) t.textContent = fmt(val * 580) + ' ₽'; const r9 = document.getElementById('r9'); if (r9) r9.textContent = String(val).replace('.', ','); }
draw();
</script></body></html>
