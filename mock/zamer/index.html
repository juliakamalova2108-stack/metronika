<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Замер — макет</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/vyezdy.css">
<style>
  .vs { display: flex; gap: 4px; margin: 0 0 8px; padding: 3px; border-radius: 8px; background: rgba(0,0,0,.28); position: relative; z-index: 40; }
  .vs button { flex: 1; height: 32px; border: 0; border-radius: 6px; background: none; color: rgba(237,240,231,.6); font: 600 12px/1 var(--font-body); cursor: pointer; }
  .vs button.is-on { background: #e6f2cc; color: #13292b; }
  .zh { margin: 0 2px 10px; font: 400 13px/18px var(--font-body); color: rgba(230,242,204,.8); }
  .o-pvbar { position: relative; }
  .wall { padding: 10px; gap: 8px; margin-bottom: 10px; }
  .wall__hd { display: flex; align-items: center; justify-content: space-between; margin: 0 4px; font: 600 16px/20px var(--font-body); color: #fff; }
  .wall__hd small { font: 400 12px/1 var(--font-body); color: rgba(237,240,231,.6); margin-left: 8px; }
  .wall__hd .x { width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(204,222,209,.35); background: none; color: rgba(237,240,231,.7); font-size: 18px; }
  .dims { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 6px; }
  .dim { display: flex; flex-direction: column; gap: 4px; }
  .dim span { font: 400 11px/14px var(--font-body); color: rgba(237,240,231,.7); margin-left: 4px; }
  .dim .o-qty { width: auto; height: 46px; } .dim .o-qty input { font-size: 18px !important; text-align: left !important; padding-left: 4px; }
  .dim.res .o-qty { background: #2d4a3a; border-color: rgba(222,237,194,.6); }
  .wbtns { display: flex; gap: 6px; } .wbtns .f-btn { flex: 1; height: 40px; font-size: 13px; }
  .open { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.18); font: 400 13px/16px var(--font-body); color: rgba(237,240,231,.85); }
  .open b { margin-left: auto; font: 600 13px/1 var(--font-num); color: #ff9c9c; }
  .addwall { width: 100%; height: 52px; margin: 0 0 12px; border-radius: 14px; border: 1.5px dashed rgba(230,242,204,.55); background: rgba(230,242,204,.05); color: #e6f2cc; font: 600 15px/1 var(--font-body); }
  .twin { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .twin .o-same.o-same--v2 .o-svc { grid-template-columns: 1fr auto; padding-left: 12px; } 
  .sumbar { margin-top: 2px; }
</style></head>
<body class="fig"><div class="app"><main id="view" class="view"></main></div>
<script>
const NAV = `<nav class="f-nav f-nav--tabs"><button type="button" class="f-nav__tab f-nav__menu"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2" rx="1" fill="#A3AEBE"/><rect x="3" y="10" width="18" height="2" rx="1" fill="#A3AEBE"/><rect x="3" y="15" width="18" height="2" rx="1" fill="#A3AEBE"/></svg><span>Меню</span></button><div class="f-topnav f-botnav f-botnav--many"><div class="f-topnav__track" style="justify-content:flex-end"><button class="f-tab">План</button><button class="f-tab">Клиент</button><button class="f-tab">Источник</button><button class="f-tab is-active">Замер</button></div></div></nav>`;
const CALC = '<span class="o-calc-ico" aria-hidden="true"><i></i><b></b><b></b><b></b><b></b></span>';
const pv = (n, c, s, on, ok) => `<button type="button" class="o-pv${on ? ' is-on' : ''}" style="--rc:${c}"><b class="o-pv__n">${n}</b><span class="o-pv__m">${s}<small> ₽</small></span>${ok ? '<i class="o-pv__ok">✓</i>' : ''}</button>`;
const strip = (rooms, sum) => `<div class="o-pvbar"><button type="button" class="o-pv-add"><span>+</span></button><div class="o-pvs">${rooms}${sum ? pv('Итог', '#c8d9a8', sum) : ''}</div></div>`;
const tog = (on) => `<span class="o-same__tog"><span class="o-tog${on ? ' is-on' : ''}"><i></i></span></span>`;
const plate = (n, c, inner) => `<section class="f-plate o-rplate" style="--rc:${c}"><div class="o-rhead"><span class="o-rhead__t"><b>${n}</b><small>1 этаж · 4 стены · 46,6 м²</small></span><span class="o-rhead__b"><button class="o-ib">${CALC}</button></span></div>${inner}</section>`;
const same = (c) => `<div class="o-same-wrap"><section class="o-same o-same--v2" style="--rc:${c}"><div class="o-svc">
  <label class="o-qty"><input value="2,7" readonly><span>м</span></label><span class="o-svc__t"><span class="o-svc__n">Одинаковая высота</span><small>во все стены комнаты</small></span>${tog(true)}</div></section></div>
  <div class="o-same-wrap"><section class="o-same o-same--v2" style="--rc:${c}"><div class="o-svc">
  <label class="o-qty is-locked"><input value="2" readonly><span>раб.</span></label><span class="o-svc__t"><span class="o-svc__n">Одинаковые работы</span><small>как у первой стены</small></span>${tog(true)}</div></section></div>`;
const svc = (n, p, a, c) => `<div class="o-svc"><label class="o-qty is-locked" style="border-color:${c};box-shadow:0 0 0 1.5px ${c}"><input value="${a}" readonly><span>м²</span></label><span class="o-svc__t"><span class="o-svc__n">${n}</span><small>${p} ₽/м²</small></span><b class="o-svc__s">${Math.round(parseFloat(a.replace(',', '.')) * p).toLocaleString('ru-RU')} ₽</b></div>`;
const wall = (k, L, H, S, opens, c) => `<section class="f-plate wall"><div class="wall__hd"><span>Стена ${k}<small>${L} × ${H} м</small></span><button class="x">×</button></div>
  <div class="dims"><label class="dim"><span>Длина, м</span><span class="o-qty"><input value="${L}" readonly></span></label><label class="dim"><span>Высота, м</span><span class="o-qty is-locked"><input value="${H}" readonly></span></label><label class="dim res"><span>Площадь, м²</span><span class="o-qty"><input value="${S}" readonly></span></label></div>
  ${opens ? `<div class="open">${opens}</div>` : ''}
  <div class="wbtns"><button class="f-btn">+ Окно / дверь</button><button class="f-btn">+ Работа</button></div>
  <section class="o-room o-room--rows" style="padding:0;background:none;border:0;box-shadow:none">${svc('Грунтовка стен', 100, S, c)}${svc('Поклейка флиз. обоев', 330, S, c)}</section></section>`;
const C = '#f59e0b';
const SCR = {
  1: ['Замер без оценки', 'Если клиент сразу записался на замер — комнат нет, всё начинается с большой кнопки, как в «Оценке».',
    `<button type="button" class="o-start"><span class="o-start__plus">+</span><b>Добавить комнату</b><small>Зайдите в комнату и выберите её — дальше стены и работы</small></button>`],
  2: ['После оценки', 'Комнаты из предварительной оценки уже стоят в полосе. Сверху — сумма по замеру. Открыта Гостиная: стен пока нет.',
    strip(pv('Гостиная', C, '—', true) + pv('Кухня', '#ef4444', '—'), '—') + plate('Гостиная', C, same(C)) + `<button class="addwall">+ Стена</button><p class="zh" style="text-align:center">В оценке было 18 м² — после замера сумма уточнится</p>`],
  3: ['Комната со стенами', 'В комнате «Одинаковая высота» и «Одинаковые работы»; ниже стены: длина × высота = площадь, минус окна; площадь идёт во все работы стены.',
    strip(pv('Гостиная', C, '9 896', true, true) + pv('Кухня', '#ef4444', '—'), '9 896') + plate('Гостиная', C, same(C)) + wall(1, '4,2', '2,7', '11,34', '', C) + wall(2, '3,6', '2,7', '7,62', 'Окно 1,5 × 1,4 <b>− 2,1 м²</b>', C) + `<button class="addwall">+ Стена</button>`],
};
let V = 3;
function draw() { const [t, x, h] = SCR[V];
  document.getElementById('view').innerHTML = `<div class="fig-blobs" aria-hidden="true"><i></i><i></i></div><div class="o-wrap"><div class="vs">${Object.keys(SCR).map((k) => `<button class="${V == k ? 'is-on' : ''}" onclick="V=${k};draw()">${SCR[k][0]}</button>`).join('')}</div><p class="zh">${x}</p>${h}</div>${NAV}`; }
draw();
</script></body></html>
