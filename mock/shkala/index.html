<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стена — шкала площади</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/vyezdy.css">
<style>
  :root { --rc: #f59e0b; }
  body.fig .view { padding-bottom: 60px; }
  .zx { margin: 0 2px 12px; font: 400 13px/18px var(--font-body); color: rgba(230,242,204,.85); }
  .card { padding: 12px; gap: 12px; margin-bottom: 10px; }
  .hd { display: flex; align-items: center; gap: 10px; } .hd b { font: 700 18px/22px var(--font-body); color: #fff; }
  .hd small { font: 400 12px/15px var(--font-body); color: rgba(237,240,231,.6); }
  .Lin { display: flex; align-items: center; gap: 10px; }
  .Lin label { font: 500 13px/1 var(--font-body); color: rgba(237,240,231,.75); }
  .fld { display: inline-flex; align-items: baseline; gap: 3px; height: 46px; padding: 0 12px; border-radius: 8px; border: 1.5px solid var(--rc); background: linear-gradient(180deg,#687b7a,#738582); box-shadow: 0 0 8px rgba(245,158,11,.45), inset 0 3px 6px rgba(1,9,11,.5); }
  .fld input { width: 64px; border: 0; background: none; outline: none; color: #fff; font: 700 22px/46px var(--font-num); text-align: right; }
  .fld small { font: 500 12px/1 var(--font-body); color: rgba(255,255,255,.75); }
  .hint2 { margin-left: auto; text-align: right; font: 400 12px/15px var(--font-body); color: rgba(237,240,231,.6); }
  /* шкала */
  .lab { display: flex; justify-content: space-between; margin: 0 2px 6px; font: 500 12px/1 var(--font-body); color: rgba(237,240,231,.7); }
  .lab b { font: 700 14px/1 var(--font-num); color: #fff; }
  .bar { position: relative; display: flex; height: 54px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); box-shadow: inset 0 3px 8px rgba(0,0,0,.45); }
  .seg { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; box-sizing: border-box; overflow: hidden; white-space: nowrap; transition: flex-basis .45s cubic-bezier(.3,1.2,.4,1); }
  .seg b { font: 800 17px/20px var(--font-num); color: #fff; } .seg small { font: 500 11px/13px var(--font-body); color: rgba(255,255,255,.85); }
  .seg.net { background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 85%, #fff 0%), color-mix(in srgb, var(--rc) 60%, #13292b)); }
  .seg.op { background: repeating-linear-gradient(135deg, rgba(255,120,120,.35) 0 6px, rgba(40,20,20,.35) 6px 12px); border-left: 2px solid #1b2f31; align-items: center; padding: 0 4px; }
  .seg.op b { font-size: 12px; line-height: 14px; } .seg.op small { font-size: 10px; }
  .seg.op .ic { font-size: 15px; line-height: 16px; }
  .seg.fly { animation: fly .55s cubic-bezier(.2,1.3,.4,1); }
  @keyframes fly { 0% { transform: translateY(-60px) scale(.6); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
  .empty { display: grid; place-items: center; height: 54px; border-radius: 12px; border: 1.5px dashed rgba(230,242,204,.4); font: 400 13px/1 var(--font-body); color: rgba(237,240,231,.55); }
  .row2 { display: flex; gap: 6px; } .row2 .f-btn { flex: 1; height: 42px; font-size: 13px; }
  /* работы — заливаются в шкалу */
  .wk { display: flex; flex-direction: column; gap: 6px; }
  .wrow { position: relative; height: 44px; border-radius: 10px; background: rgba(0,0,0,.22); overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
  .wfill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: linear-gradient(90deg, var(--wc), color-mix(in srgb, var(--wc) 55%, transparent)); animation: fill .8s cubic-bezier(.3,1,.4,1); }
  @keyframes fill { from { width: 0; } }
  .wtxt { position: relative; display: flex; align-items: center; height: 100%; padding: 0 10px; gap: 8px; font: 600 13.5px/1 var(--font-body); color: #fff; }
  .wtxt small { font: 400 11.5px/1 var(--font-body); color: rgba(255,255,255,.75); } .wtxt b { margin-left: auto; font: 700 14px/1 var(--font-num); }
  .wtxt .xx { width: 26px; height: 26px; border-radius: 7px; border: 0; background: rgba(0,0,0,.25); color: rgba(255,255,255,.7); font-size: 14px; }
  .total { display: flex; justify-content: space-between; margin: 2px 4px 0; font: 600 15px/1 var(--font-body); color: #fff; } .total b { font: 800 19px/1 var(--font-num); color: #e6f2cc; }
  /* выпадающая форма */
  .shade { position: fixed; inset: 0; z-index: 80; background: rgba(4,12,14,.6); }
  .sheet2 { position: fixed; z-index: 81; left: 0; right: 0; bottom: 0; padding: 10px 14px 24px; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, #2a4142, #213536); border-top: 1px solid rgba(204,222,209,.4); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40%); opacity: .3; } }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(237,240,231,.35); margin: 0 auto 12px; }
  .sheet2 h3 { margin: 0 4px 12px; font: 700 19px/24px var(--font-num); color: #fff; }
  .tp { display: flex; gap: 6px; margin-bottom: 12px; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.25); }
  .tp button { flex: 1; height: 42px; border: 0; border-radius: 8px; background: none; color: rgba(237,240,231,.7); font: 600 14px/1 var(--font-body); cursor: pointer; }
  .tp button.on { background: #213839; color: #fff; box-shadow: 0 0 0 1.5px var(--rc); }
  .sz { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .sz .fld { justify-content: center; } .sz .fld input { width: 70px; text-align: center; }
  .sz .op { color: rgba(237,240,231,.6); font: 400 20px/1 var(--font-body); }
  .szl { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin: 0 0 14px; font: 400 11px/14px var(--font-body); color: rgba(237,240,231,.6); text-align: center; }
  .wl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .wl button { height: 52px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(204,222,209,.4); background: #213839; color: #fff; text-align: left; font: 500 13.5px/16px var(--font-body); cursor: pointer; }
  .wl button small { display: block; font: 400 11px/13px var(--font-body); color: rgba(237,240,231,.6); }
  .wl button.on { border-color: var(--wc); box-shadow: 0 0 0 1.5px var(--wc); background: color-mix(in srgb, var(--wc) 30%, #213839); }
</style></head>
<body class="fig"><div class="app"><main class="view"><div class="fig-blobs"><i></i><i></i></div><div class="o-wrap" id="w"></div></main></div><div id="pop"></div>
<script>
const H = 2.7;
let L = 0, ops = [], wks = [], last = -1, popT = '', pick = 'win', ow = '', oh = '', wpick = [];
const WORKS = [['prime', 'Грунтовка', 100, '#5b8def'], ['fliz', 'Поклейка флиз.', 330, '#22c55e'], ['strip', 'Демонтаж обоев', 150, '#ef4444'], ['putty', 'Шпаклёвка', 200, '#a855f7']];
const f = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
const gross = () => L * H, opA = () => ops.reduce((a, o) => a + o.w * o.h, 0), net = () => Math.max(0, gross() - opA());
const money = (n) => Math.round(n).toLocaleString('ru-RU') + ' ₽';
function draw() {
  const g = gross();
  const bar = !L ? '<div class="empty">Введите длину — появится площадь стены</div>' : `<div class="lab"><span>Площадь стены ${f(L)} × ${f(H)}</span><b>${f(g)} м²</b></div>
    <div class="bar"><div class="seg net" style="flex-basis:${(net() / g) * 100}%"><b>${f(net())} м²</b><small>в работы</small></div>${ops.map((o, i) => `<div class="seg op${i === last ? ' fly' : ''}" style="flex-basis:${((o.w * o.h) / g) * 100}%" title="${o.t}"><span class="ic">${o.t === 'Окно' ? '🪟' : o.t === 'Дверь' ? '🚪' : '⬜'}</span><b>−${f(o.w * o.h)}</b></div>`).join('')}</div>`;
  const wl = wks.map((k, i) => { const [, n, p, c] = WORKS.find((x) => x[0] === k); return `<div class="wrow"><div class="wfill" style="--wc:${c};--w:${(net() / g) * 100}%"></div><div class="wtxt">${n}<small>${f(net())} м² × ${p}</small><b>${money(net() * p)}</b><button class="xx" onclick="wks.splice(${i},1);draw()">×</button></div></div>`; }).join('');
  const tot = wks.reduce((a, k) => a + net() * WORKS.find((x) => x[0] === k)[2], 0);
  document.getElementById('w').innerHTML = `<p class="zx">Ввёл длину — появилась шкала площади стены. Добавил окно или проём — он «залетает» в шкалу и занимает свою долю. Добавил работы — каждая заливается своей полосой на площадь, что идёт в работы.</p>
    <section class="f-plate card"><div class="hd"><b>Стена 1</b><small>высота 2,7 м — одинаковая</small></div>
      <div class="Lin"><label>Длина</label><span class="fld"><input id="L" inputmode="decimal" value="${L ? f(L) : ''}" placeholder="—" oninput="setL(this.value)"><small>м</small></span><span class="hint2">${L ? `${ops.length} проём${ops.length === 1 ? '' : ops.length > 1 && ops.length < 5 ? 'а' : 'ов'}` : 'например 4,2'}</span></div>
      <div id="barbox">${bar}</div>
      ${L ? `<div class="row2"><button class="f-btn" onclick="openOp()">+ Окно / проём</button><button class="f-btn" onclick="openW()">+ Работа</button></div>` : ''}
      ${wks.length ? `<div class="wk">${wl}</div><div class="total"><span>Стена 1 итого</span><b>${money(tot)}</b></div>` : ''}
    </section>`;
  last = -1;
}
function setL(v) { L = parseFloat(String(v).replace(',', '.')) || 0; const pos = 1; draw(); const el = document.getElementById('L'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
const PRE = { win: ['Окно', 1.5, 1.4], door: ['Дверь', 0.9, 2.1], arch: ['Проём', 1.2, 2.1] };
function openOp() { pick = 'win'; ow = PRE.win[1]; oh = PRE.win[2]; drawOp(); }
function drawOp() {
  document.getElementById('pop').innerHTML = `<div class="shade" onclick="closePop()"></div><div class="sheet2"><div class="grab"></div><h3>Что в стене?</h3>
    <div class="tp">${Object.entries(PRE).map(([k, [n]]) => `<button class="${pick === k ? 'on' : ''}" onclick="pick='${k}';ow=PRE.${k}[1];oh=PRE.${k}[2];drawOp()">${k === 'win' ? '🪟' : k === 'door' ? '🚪' : '⬜'} ${n}</button>`).join('')}</div>
    <div class="sz"><span class="fld"><input inputmode="decimal" value="${f(ow)}" oninput="ow=parseFloat(this.value.replace(',','.'))||0"><small>м</small></span><span class="op">×</span><span class="fld"><input inputmode="decimal" value="${f(oh)}" oninput="oh=parseFloat(this.value.replace(',','.'))||0"><small>м</small></span></div>
    <div class="szl"><span>ширина</span><span></span><span>высота</span></div>
    <div class="f-btn-row" style="width:calc(50% + 2.5px);margin:0 auto"><button class="f-btn" onclick="addOp()">Добавить</button></div></div>`;
}
function addOp() { ops.push({ t: PRE[pick][0], w: ow, h: oh }); last = ops.length - 1; closePop(); draw(); }
function openW() { wpick = []; drawW(); }
function drawW() {
  document.getElementById('pop').innerHTML = `<div class="shade" onclick="closePop()"></div><div class="sheet2"><div class="grab"></div><h3>Работы на стене</h3>
    <div class="wl">${WORKS.filter(([k]) => !wks.includes(k)).map(([k, n, p, c]) => `<button class="${wpick.includes(k) ? 'on' : ''}" style="--wc:${c}" onclick="wpick.includes('${k}')?wpick.splice(wpick.indexOf('${k}'),1):wpick.push('${k}');drawW()">${n}<small>${p} ₽/м²</small></button>`).join('')}</div>
    <div class="f-btn-row" style="width:calc(50% + 2.5px);margin:0 auto"><button class="f-btn" onclick="wks.push(...wpick);closePop();draw()">${wpick.length ? 'Добавить · ' + wpick.length : 'Готово'}</button></div></div>`;
}
function closePop() { document.getElementById('pop').innerHTML = ''; }
draw();
</script></body></html>
