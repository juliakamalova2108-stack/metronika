<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стена — графические варианты</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/vyezdy.css">
<style>
  :root { --rc: #f59e0b; }
  body.fig .view { padding-bottom: 60px; }
  .vs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; padding: 3px; border-radius: 8px; background: rgba(0,0,0,.28); }
  .vs button { flex: 1 0 calc(20% - 4px); height: 32px; border: 0; border-radius: 6px; background: none; color: rgba(237,240,231,.6); font: 600 13px/1 var(--font-body); cursor: pointer; }
  .vs button.is-on { background: #e6f2cc; color: #13292b; }
  .zx { margin: 0 2px 12px; font: 400 13px/18px var(--font-body); color: rgba(230,242,204,.85); }
  .card { padding: 12px; gap: 10px; margin-bottom: 10px; }
  .hd { display: flex; align-items: baseline; gap: 8px; } .hd b { font: 700 17px/20px var(--font-body); color: #fff; } .hd small { font: 400 12px/1 var(--font-body); color: rgba(237,240,231,.6); }
  .hd .r { margin-left: auto; font: 700 17px/1 var(--font-num); color: #e6f2cc; } .hd .r small { color: rgba(230,242,204,.7); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tap { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: #edf0e7; font: 500 12.5px/1 var(--font-body); }
  .chip b { font: 700 12px/1 var(--font-num); color: #ff9c9c; }
  .addbtn { height: 30px; padding: 0 12px; border-radius: 15px; border: 1.5px dashed rgba(230,242,204,.6); background: none; color: #e6f2cc; font: 600 12.5px/1 var(--font-body); cursor: pointer; }
  .works { display: flex; flex-direction: column; gap: 6px; } .works .o-svc { height: 54px; }
  .works .o-qty { border-color: var(--rc) !important; box-shadow: 0 0 0 1.5px var(--rc) !important; }
  .Lfld { display: inline-flex; align-items: baseline; gap: 3px; height: 34px; padding: 0 10px; border-radius: 6px; border: 1.5px solid var(--rc); background: linear-gradient(180deg,#687b7a,#738582); box-shadow: 0 0 8px rgba(245,158,11,.45), inset 0 3px 6px rgba(1,9,11,.5); color: #fff; font: 700 17px/34px var(--font-num); }
  .Lfld small { font: 500 11px/1 var(--font-body); color: rgba(255,255,255,.75); }
  /* шторка добавления проёма */
  .shade { position: fixed; inset: 0; z-index: 80; background: rgba(4,12,14,.6); }
  .sheet2 { position: fixed; z-index: 81; left: 0; right: 0; bottom: 0; padding: 10px 14px 24px; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, #2a4142, #213536); border-top: 1px solid rgba(204,222,209,.4); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40%); opacity: .3; } }
  .sheet2 .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(237,240,231,.35); margin: 0 auto 12px; }
  .sheet2 h3 { margin: 0 4px 12px; font: 700 19px/24px var(--font-num); color: #fff; }
  .pres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .pre { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 12px; border: 1px solid rgba(204,222,209,.4); background: #213839; color: #edf0e7; font: 600 13px/16px var(--font-body); cursor: pointer; }
  .pre small { font: 400 11px/14px var(--font-num); color: rgba(237,240,231,.65); }
  .pre.on { border-color: var(--rc); box-shadow: 0 0 0 1.5px var(--rc); }
  .sz { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 14px; }
  .sz .Lfld { justify-content: center; height: 46px; line-height: 46px; font-size: 20px; }
  .sz span.op { color: rgba(237,240,231,.6); font: 400 20px/1 var(--font-body); }
</style></head>
<body class="fig"><div class="app"><main class="view"><div class="fig-blobs"><i></i><i></i></div><div class="o-wrap" id="w"></div></main></div><div id="pop"></div>
<script>
const L = 4.2, H = 2.7, RC = '#f59e0b';
let ops = [{ t: 'win', x: 0.7, w: 1.5, h: 1.4, y: 0.9 }, { t: 'door', x: 3.0, w: 0.9, h: 2.1, y: 0 }];
const area = () => Math.round((L * H - ops.reduce((a, o) => a + o.w * o.h, 0)) * 100) / 100;
const f = (n) => String(n).replace('.', ',');
const NAME = { win: 'Окно', door: 'Дверь', arch: 'Проём' };
const works = () => `<div class="works">${[['Грунтовка стен', 100], ['Поклейка флиз. обоев', 330]].map(([n, p]) => `<div class="o-svc"><label class="o-qty is-locked"><input value="${f(area())}" readonly><span>м²</span></label><span class="o-svc__t"><span class="o-svc__n">${n}</span><small>${p} ₽/м²</small></span><b class="o-svc__s">${Math.round(area() * p).toLocaleString('ru-RU')} ₽</b></div>`).join('')}</div>`;
const legend = () => `<div class="legend">${ops.map((o) => `<span class="chip">${NAME[o.t]} ${f(o.w)}×${f(o.h)} <b>−${f(Math.round(o.w * o.h * 100) / 100)}</b></span>`).join('')}<button class="addbtn" onclick="openAdd()">+ окно / дверь</button></div>`;
const hd = (k = 1, extra = '') => `<div class="hd"><b>Стена ${k}</b><small>${extra || 'высота 2,7 м'}</small><span class="r">${f(area())}<small> м²</small></span></div>`;

// ---------- рисунки ----------
const W = 330;
function sx(m) { return (m / L) * W; }
function openSVG(o, h, top, style) {
  const x = sx(o.x), w = sx(o.w), oh = (o.h / H) * h, y = top + h - ((o.y + o.h) / H) * h;
  if (style === 'glass') {
    if (o.t === 'door') return `<g><rect x="${x}" y="${y}" width="${w}" height="${oh}" rx="2" fill="#13292b" stroke="#e6f2cc" stroke-width="1.5"/><circle cx="${x + w - 6}" cy="${y + oh / 2}" r="2" fill="#e6f2cc"/></g>`;
    return `<g><rect x="${x}" y="${y}" width="${w}" height="${oh}" rx="2" fill="url(#sky)" stroke="#e6f2cc" stroke-width="1.5"/><line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + oh}" stroke="#e6f2cc" stroke-width="1.2"/><line x1="${x}" y1="${y + oh / 2}" x2="${x + w}" y2="${y + oh / 2}" stroke="#e6f2cc" stroke-width="1.2"/></g>`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${oh}" fill="#1b2f31" stroke="#ff9c9c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x + w / 2}" y="${y + oh / 2 + 4}" text-anchor="middle" font-size="10" fill="#ff9c9c" font-family="Manrope, sans-serif">−${f(Math.round(o.w * o.h * 100) / 100)}</text>`;
}
const DEFS = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#3b6f8f"/></linearGradient>
  <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="rgba(245,158,11,.14)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(245,158,11,.45)" stroke-width="2"/></pattern>
  <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#a8693a"/><path d="M0 0H24M0 6H24M0 12H24M6 0V6M18 6V12" stroke="#7a4826" stroke-width="1"/></pattern>
  <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f4f1e6"/><path d="M16 0V16M0 16H16" stroke="rgba(59,130,246,.18)" stroke-width="1"/></pattern></defs>`;
const dimTop = (y, txt) => `<g stroke="rgba(237,240,231,.6)" stroke-width="1"><line x1="0" y1="${y}" x2="${W}" y2="${y}"/><line x1="0" y1="${y - 5}" x2="0" y2="${y + 5}"/><line x1="${W}" y1="${y - 5}" x2="${W}" y2="${y + 5}"/></g><rect x="${W / 2 - 34}" y="${y - 11}" width="68" height="22" rx="6" fill="#213839" stroke="${RC}" stroke-width="1.5"/><text x="${W / 2}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Onest, Manrope, sans-serif">${txt}</text>`;
const plusEnd = (x, y, h) => `<g class="tap" onclick="openAdd()"><rect x="${x}" y="${y}" width="28" height="${h}" rx="8" fill="rgba(230,242,204,.08)" stroke="rgba(230,242,204,.6)" stroke-dasharray="4 3"/><text x="${x + 14}" y="${y + h / 2 + 7}" text-anchor="middle" font-size="22" fill="#e6f2cc">+</text></g>`;

const V = {
  1: ['Чертёж', 'Стена — заштрихованная полоса высотой ~60 px в цвете комнаты, сверху размерная линия с длиной. Окна и двери — пунктирные вырезы с вычетом. «+» в конце полосы — добавить проём.',
    () => `${hd()}<svg viewBox="-4 -4 ${W + 40} 92">${DEFS}${dimTop(8, '4,2 м')}<rect x="0" y="24" width="${W}" height="60" fill="url(#hatch)" stroke="${RC}" stroke-width="2"/>${ops.map((o) => openSVG(o, 60, 24)).join('')}${plusEnd(W + 8, 24, 60)}</svg>${legend()}${works()}`],
  2: ['Кладка', 'Стена буквально нарисована кирпичом, окно — голубое стекло с переплётом, дверь — тёмная с ручкой. Наглядно, как на объекте.',
    () => `${hd()}<svg viewBox="-4 -4 ${W + 40} 96">${DEFS}${dimTop(8, '4,2 м')}<rect x="0" y="24" width="${W}" height="64" rx="3" fill="url(#brick)"/><rect x="0" y="84" width="${W}" height="4" fill="#5c3a20"/>${ops.map((o) => openSVG(o, 64, 24, 'glass')).join('')}${plusEnd(W + 8, 24, 64)}</svg>${legend()}${works()}`],
  3: ['Развёртка', 'Все стены комнаты одной лентой, как развёртка на чертеже: 1·2·3·4 подряд. Нажал стену — она выделена, под лентой её проёмы и работы.',
    () => { const ws = [[4.2, 1], [3.6, 0], [4.2, 0], [3.6, 0]]; const tot = 15.6; let x = 0;
      const segs = ws.map(([l, on], i) => { const w = (l / tot) * (W + 30); const g = `<g><rect x="${x}" y="22" width="${w - 3}" height="56" fill="${on ? 'url(#hatch)' : 'rgba(255,255,255,.05)'}" stroke="${on ? RC : 'rgba(237,240,231,.3)'}" stroke-width="${on ? 2 : 1}"/><text x="${x + w / 2}" y="14" text-anchor="middle" font-size="11" fill="${on ? '#fff' : 'rgba(237,240,231,.6)'}" font-family="Onest, Manrope, sans-serif" font-weight="700">${i + 1} · ${f(l)} м</text>${on ? `<rect x="${x + 14}" y="36" width="26" height="22" fill="#1b2f31" stroke="#ff9c9c" stroke-dasharray="3 2"/><rect x="${x + w - 26}" y="34" width="16" height="44" fill="#1b2f31" stroke="#ff9c9c" stroke-dasharray="3 2"/>` : ''}</g>`; x += w; return g; }).join('');
      return `${hd(1, 'развёртка комнаты · 4 стены')}<svg viewBox="-4 -2 ${W + 38} 84">${DEFS}${segs}</svg>${legend()}${works()}`; }],
  4: ['План сверху', 'Комната нарисована планом сверху. Каждая сторона — стена с длиной; выбранная стена горит цветом комнаты, на ней разрывы — окно и дверь.',
    () => `${hd(1, 'вид сверху · стена 1 выбрана')}<svg viewBox="-20 -20 ${W + 40} 190">${DEFS}<rect x="40" y="10" width="250" height="150" fill="rgba(255,255,255,.04)" stroke="rgba(237,240,231,.35)" stroke-width="6"/><line x1="40" y1="10" x2="290" y2="10" stroke="${RC}" stroke-width="8"/><line x1="90" y1="10" x2="150" y2="10" stroke="#8fd3ff" stroke-width="8"/><path d="M230 10 L230 10 A36 36 0 0 1 266 46" fill="none" stroke="#ff9c9c" stroke-width="1.5" stroke-dasharray="3 2"/><line x1="230" y1="10" x2="266" y2="10" stroke="#1d3233" stroke-width="9"/>
      <text x="165" y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Onest, Manrope, sans-serif">1 · 4,2 м</text><text x="300" y="90" font-size="12" fill="rgba(237,240,231,.6)" font-family="Onest, Manrope, sans-serif">2 · 3,6</text><text x="165" y="182" text-anchor="middle" font-size="12" fill="rgba(237,240,231,.6)" font-family="Onest, Manrope, sans-serif">3 · 4,2</text><text x="-14" y="90" font-size="12" fill="rgba(237,240,231,.6)" font-family="Onest, Manrope, sans-serif">4 · 3,6</text>
      <text x="165" y="92" text-anchor="middle" font-size="22" font-weight="800" fill="rgba(245,158,11,.85)" font-family="Onest, Manrope, sans-serif">Гостиная</text></svg>${legend()}${works()}`],
  5: ['Полосы обоев', 'Стена разбита на полосы рулона (по 1,06 м): сразу видно, сколько полос и рулонов уйдёт. Окна и двери вырезаны прямо из полос.',
    () => { const n = Math.ceil(L / 1.06); let s = ''; for (let i = 0; i < n; i++) { const x = sx(i * 1.06); const w = Math.min(sx(1.06), W - x); s += `<rect x="${x}" y="24" width="${w - 1.5}" height="60" fill="${i % 2 ? 'rgba(245,158,11,.30)' : 'rgba(245,158,11,.18)'}"/><text x="${x + w / 2}" y="98" text-anchor="middle" font-size="10" fill="rgba(237,240,231,.6)" font-family="Onest, Manrope, sans-serif">${i + 1}</text>`; }
      return `${hd(1, `${n} полосы · ≈ 2 рулона`)}<svg viewBox="-4 -4 ${W + 40} 104">${DEFS}${dimTop(8, '4,2 м')}${s}<rect x="0" y="24" width="${W}" height="60" fill="none" stroke="${RC}" stroke-width="2"/>${ops.map((o) => openSVG(o, 60, 24, 'glass')).join('')}${plusEnd(W + 8, 24, 60)}</svg>${legend()}${works()}`; }],
  6: ['Объём', 'Стена в лёгкой перспективе — как будто смотришь на неё в комнате: пол, плинтус, окно с подоконником. Размеры — бирками на стене.',
    () => `${hd()}<svg viewBox="-4 -4 ${W + 40} 128">${DEFS}<path d="M20 10 L${W - 10} 10 L${W + 10} 104 L0 104 Z" fill="rgba(245,158,11,.16)" stroke="${RC}" stroke-width="2"/><path d="M0 104 L${W + 10} 104 L${W + 30} 122 L-20 122 Z" fill="rgba(255,255,255,.05)"/><path d="M${sx(0.7) + 18} 30 L${sx(2.2) + 14} 30 L${sx(2.2) + 16} 70 L${sx(0.7) + 16} 70 Z" fill="url(#sky)" stroke="#e6f2cc" stroke-width="1.5"/><rect x="${sx(0.7) + 12}" y="70" width="${sx(1.5) + 10}" height="4" fill="#e6f2cc"/><path d="M${sx(3) + 6} 34 L${sx(3.9) + 4} 34 L${sx(3.9) + 8} 104 L${sx(3) + 6} 104 Z" fill="#13292b" stroke="#e6f2cc" stroke-width="1.5"/>
      <rect x="${W / 2 - 34}" y="-2" width="68" height="22" rx="11" fill="#213839" stroke="${RC}"/><text x="${W / 2}" y="13" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Onest, Manrope, sans-serif">↔ 4,2 м</text>${plusEnd(W + 14, 30, 60)}</svg>${legend()}${works()}`],
  7: ['Рулетка', 'Над стеной лента рулетки с делениями — длина ставится, протянув риску. Окна и двери висят на ленте бирками на своём месте.',
    () => { let t = ''; for (let i = 0; i <= 42; i++) { const x = (i / 42) * W; t += `<line x1="${x}" y1="${i % 10 ? 18 : 12}" x2="${x}" y2="26" stroke="#13292b" stroke-width="${i % 10 ? 1 : 2}"/>`; if (!(i % 10)) t += `<text x="${x + 2}" y="10" font-size="9" fill="#13292b" font-family="Onest, Manrope, sans-serif">${i / 10}</text>`; }
      return `${hd()}<svg viewBox="-4 -4 ${W + 40} 104">${DEFS}<rect x="-2" y="0" width="${W + 4}" height="28" rx="4" fill="#e6d36a"/>${t}<line x1="${W}" y1="-4" x2="${W}" y2="98" stroke="#e5484d" stroke-width="2.5"/><rect x="${W - 30}" y="-16" width="60" height="16" rx="4" fill="#e5484d"/><text x="${W}" y="-4" text-anchor="middle" font-size="11" fill="#fff" font-weight="700" font-family="Onest, Manrope, sans-serif">4,2 м</text>
        <rect x="0" y="34" width="${W}" height="56" fill="url(#hatch)" stroke="${RC}" stroke-width="1.5"/>${ops.map((o) => openSVG(o, 56, 34, 'glass')).join('')}${plusEnd(W + 10, 34, 56)}</svg>${legend()}${works()}`; }],
  8: ['Дорожка-слоты', 'Стена — дорожка, а окна и двери — плитки-иконки, стоящие в ней по ширине. Плитки можно переставить пальцем; «+» добавляет новую.',
    () => `${hd()}<svg viewBox="-4 -4 ${W + 40} 94">${DEFS}${dimTop(8, '4,2 м')}<rect x="0" y="24" width="${W}" height="62" rx="12" fill="#213839" stroke="${RC}" stroke-width="2"/>${ops.map((o) => { const x = sx(o.x), w = sx(o.w); return `<g><rect x="${x}" y="32" width="${w}" height="46" rx="9" fill="${o.t === 'door' ? '#3c3f5f' : '#2e5b6f'}" stroke="rgba(255,255,255,.5)"/><text x="${x + w / 2}" y="54" text-anchor="middle" font-size="16">${o.t === 'door' ? '🚪' : '🪟'}</text><text x="${x + w / 2}" y="71" text-anchor="middle" font-size="9" fill="#fff" font-family="Onest, Manrope, sans-serif">${f(o.w)}×${f(o.h)}</text></g>`; }).join('')}${plusEnd(W + 8, 24, 62)}</svg>${legend()}${works()}`],
  9: ['Лист замера', 'Как бумажный замерный лист на планшете: миллиметровка, стена от руки синим, размеры подписаны. Привычно мастеру, который замерял на бумаге.',
    () => `<div class="hd" style="color:#13292b"><b>Стена 1</b><small>лист замера</small><span class="r">${f(area())}<small> м²</small></span></div><svg viewBox="-10 -10 ${W + 50} 120" style="border-radius:10px">${DEFS}<rect x="-10" y="-10" width="${W + 50}" height="120" fill="url(#paper)"/><path d="M2 30 L${W - 2} 28 L${W} 92 L0 93 Z" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round"/><path d="M${sx(0.7)} 46 l${sx(1.5)} -1 l1 30 l-${sx(1.5)} 1 z M${sx(0.7) + sx(0.75)} 45 v31" fill="none" stroke="#1d4ed8" stroke-width="1.6"/><path d="M${sx(3)} 38 l${sx(0.9)} 0 l0 54 M${sx(3)} 38 l0 54" fill="none" stroke="#1d4ed8" stroke-width="1.6"/><text x="${W / 2}" y="18" text-anchor="middle" font-size="16" fill="#1d4ed8" font-family="Comic Sans MS, Marker Felt, cursive">4,2 м</text><text x="${W + 6}" y="64" font-size="13" fill="#1d4ed8" font-family="cursive">2,7</text><text x="${sx(1.45)}" y="88" text-anchor="middle" font-size="11" fill="#dc2626" font-family="cursive">окно −2,1</text><text x="${sx(3.45)}" y="104" text-anchor="middle" font-size="11" fill="#dc2626" font-family="cursive">дверь</text>${plusEnd(W + 10, 30, 62)}</svg>${legend()}${works()}`],
  10: ['Свет и тень', 'Стена — светлая панель, освещённая сверху, окна дают на ней пятна света; сразу видно, где проёмы. Минималистично, но «живо».',
    () => `${hd()}<svg viewBox="-4 -4 ${W + 40} 96">${DEFS}<defs><linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef6dc"/><stop offset="1" stop-color="#b9c9a2"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="rgba(255,236,170,.9)"/><stop offset="1" stop-color="rgba(255,236,170,0)"/></radialGradient></defs>
      ${dimTop(8, '4,2 м')}<rect x="0" y="24" width="${W}" height="62" rx="10" fill="url(#wl)"/>${ops.filter((o) => o.t === 'win').map((o) => `<ellipse cx="${sx(o.x + o.w / 2)}" cy="70" rx="${sx(o.w)}" ry="22" fill="url(#glow)"/>`).join('')}${ops.map((o) => openSVG(o, 62, 24, 'glass')).join('')}<text x="${W - 10}" y="80" text-anchor="end" font-size="15" font-weight="800" fill="#13292b" font-family="Onest, Manrope, sans-serif">${f(area())} м²</text>${plusEnd(W + 8, 24, 62)}</svg>${legend()}${works()}`],
};
let K = 1, pick = 'win';
function draw() { const [t, x, fn] = V[K];
  document.getElementById('w').innerHTML = `<div class="vs">${Object.keys(V).map((k) => `<button class="${K == k ? 'is-on' : ''}" onclick="K=${k};draw()">${k}</button>`).join('')}</div><p class="zx"><b>${K}. ${t}.</b> ${x} <i style="opacity:.75">Нажмите «+» — откроется добавление проёма.</i></p>
    <section class="f-plate card"><div style="display:flex;align-items:center;gap:8px;margin:0 2px"><span class="mut" style="font:400 12px/1 var(--font-body);color:rgba(237,240,231,.65)">Длина</span><span class="Lfld">4,2<small>м</small></span><span style="margin-left:auto;font:400 12px/1 var(--font-body);color:rgba(237,240,231,.65)">высота 2,7 м — одинаковая</span></div>${fn()}</section>`; }
function openAdd() { pick = 'win'; drawPop(); }
function drawPop() {
  const pr = { win: ['Окно', '1,5 × 1,4'], door: ['Дверь', '0,9 × 2,1'], arch: ['Проём', '1,2 × 2,1'] };
  document.getElementById('pop').innerHTML = `<div class="shade" onclick="closeAdd()"></div><div class="sheet2"><div class="grab"></div><h3>Добавить в стену</h3>
    <div class="pres">${Object.entries(pr).map(([k, [n, s]]) => `<button class="pre${pick === k ? ' on' : ''}" onclick="pick='${k}';drawPop()"><span style="font-size:24px">${k === 'win' ? '🪟' : k === 'door' ? '🚪' : '⬜'}</span>${n}<small>${s}</small></button>`).join('')}</div>
    <div class="sz"><span class="Lfld">${pr[pick][1].split(' × ')[0]}<small>м</small></span><span class="op">×</span><span class="Lfld">${pr[pick][1].split(' × ')[1]}<small>м</small></span></div>
    <div class="f-btn-row" style="width:calc(50% + 2.5px);margin:0 auto"><button class="f-btn" onclick="addOp()">Добавить</button></div></div>`;
}
function closeAdd() { document.getElementById('pop').innerHTML = ''; }
function addOp() { const d = { win: { w: 1.2, h: 1.2, y: 0.9 }, door: { w: 0.8, h: 2.0, y: 0 }, arch: { w: 1.0, h: 2.0, y: 0 } }[pick]; ops.push({ t: pick, x: Math.max(0, Math.min(L - d.w, 2.3)), ...d }); closeAdd(); draw(); }
draw();
</script></body></html>
