const NAV = `<nav class="f-nav f-nav--tabs" aria-label="Нижнее меню">

    <div class="f-topnav f-botnav"><div class="f-topnav__track" role="tablist"><button type="button" role="tab" aria-selected="false" class="f-tab" data-action="f-tab" data-tab="channel">Канал</button><button type="button" role="tab" aria-selected="false" class="f-tab" data-action="f-tab" data-tab="client">Клиент</button><button type="button" role="tab" aria-selected="true" class="f-tab is-active" data-action="f-tab" data-tab="estimate">Оценка</button><button type="button" role="tab" aria-selected="false" class="f-tab" data-action="f-tab" data-tab="schedule">График</button></div></div>
  </nav>`;
const TYPES = [['Спальня','#3b82f6'],['Гостиная','#f59e0b'],['Кухня','#ef4444'],['Коридор','#10b981'],['Детская','#8b5cf6'],['Прихожая','#f97316'],['Санузел','#0ea5e9'],['Балкон','#14b8a6'],['Кабинет','#eab308']];
const SVC = [['prime','Грунтовка стен',100],['fliz','Поклейка флиз. обоев',330],['strip','Демонтаж обоев',150]];
const money = (n) => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c);
let V = 1, rooms = [], open = null, draft = null, sheet = false, note = null, uid = 0;
function mk(n, c) { const k = rooms.filter((r) => r.type === n).length; return { id: ++uid, type: n, name: k ? `${n} ${k + 1}` : n, c, q: {}, same: '' }; }
const sum = (r) => SVC.reduce((s, [id, , p]) => s + (parseFloat(r.q[id]) || 0) * p, 0);
const total = () => rooms.reduce((s, r) => s + sum(r), 0);
const HINT = {
  1: 'Плашки: комнаты — плашки с суммой, выбранная залита цветом комнаты.',
  2: 'Язычки: язычки папки, выбранный срастается с карточкой комнаты.',
  3: 'Кружки: как истории в Telegram — кружки с буквой и цветным кольцом.',
  4: 'Трек: утопленная дорожка, выбранная комната — выпуклая кнопка; выбор комнат списком.',
  5: 'Линии: просто названия, выбранная подчёркнута цветом комнаты. Самый лёгкий вид.',
  6: 'Таблетки: скруглённые таблетки с цветной обводкой, «+» круглый.',
  7: 'Карусель: текущая комната крупно по центру, соседние мельче по краям, справа «2 / 3». Похоже на наши «уши» в оценке сейчас.',
  8: 'Точки: в полосе только текущая комната крупно и стрелки, под ней цветные точки — сколько комнат и где вы.',
  9: 'Иконки: комнаты — цветные квадратики, как значки приложений на телефоне.',
  10: 'Шаги: комнаты по порядку на линии с номерами — видно, какая по счёту.',
  11: 'Закладки: цветные ленточки свисают сверху, выбранная длиннее.',
  12: 'Шкала: одна полоса, поделённая на комнаты; ширина куска — по сумме комнаты.',
  13: 'Прогресс: внизу каждой плашки полоска — сколько работ уже заполнено, ✓ — сохранена.',
  14: 'По этажам: комнаты в полосе сгруппированы по этажам с подписью.',
};
function vars() { return `<div class="mk-vars">${[['1','Плашки'],['2','Язычки'],['3','Кружки'],['4','Трек'],['5','Линии'],['6','Таблетки'],['7','Карусель'],['8','Точки'],['9','Иконки'],['10','Шаги'],['11','Закладки'],['12','Шкала'],['13','Прогресс'],['14','Этажи']].map(([n, t]) => `<button class="${D == n ? 'is-on' : ''}" onclick="setD(${n})">${t}</button>`).join('')}</div><p class="mk-hint">${HINT[D]}</p>`; }
let D = 1;
function setD(n) { D = n; draw(); }
const head = (t, s) => `<div class="o-head"><div class="o-cur"><b>${esc(t)}</b>${s ? `<small>${esc(s)}</small>` : ''}</div></div>`;
const cnt = () => rooms.length ? `${rooms.length} ${plural(rooms.length, 'комната', 'комнаты', 'комнат')} · ${money(total())}` : 'комнат пока нет';
function chips(on, fn) { return TYPES.map(([n, c]) => `<button type="button" class="mk-chip${on === n ? ' is-on' : ''}" style="--rc:${c}" onclick="${fn}('${n}','${c}')"><i></i>${n}</button>`).join(''); }
function folded(r, act) {
  const n = SVC.filter(([id]) => parseFloat(r.q[id])).length;
  return `<section class="o-sroom" style="--rc:${r.c}"><button type="button" class="o-sroom__head" onclick="${act}(${r.id})">
    <span class="o-sroom__name"><b>${esc(r.name)}</b><small>${n} ${plural(n, 'работа', 'работы', 'работ')}</small></span>
    <span class="o-sroom__sum"><b>${money(sum(r))}</b><small>изменить</small></span>
    <span class="o-sroom__chev"><svg viewBox="0 0 16 16" fill="none"><path d="M3 5.5L8 10.5L13 5.5" stroke="#EDF0E7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></section>`;
}
function fields(r) {
  return `<div class="o-svc"><label class="o-qty"><input inputmode="decimal" value="${esc(r.same)}" placeholder="—" oninput="setSame(${r.id},this.value)"><span>м²</span></label>
      <span class="o-svc__t"><span class="o-svc__n">Одинаковый объём</span><small>во все работы сразу</small></span><span class="o-tog is-on" aria-hidden="true"><i></i></span></div>
    ${SVC.map(([id, n, p]) => `<div class="o-svc"><label class="o-qty"><input inputmode="decimal" value="${esc(r.q[id] || '')}" placeholder="—" data-q="${r.id}-${id}" oninput="setQ(${r.id},'${id}',this.value)"><span>м²</span></label>
      <span class="o-svc__t"><span class="o-svc__n">${n}</span><small>${p} ₽/м²</small></span><b class="o-svc__s" id="s-${r.id}-${id}">${money((parseFloat(r.q[id]) || 0) * p)}</b></div>`).join('')}
    <div class="mk-sum"><span>Итого по комнате</span><b id="t-${r.id}">${money(sum(r))}</b></div>`;
}
const grand = () => rooms.length ? `<section class="f-plate o-grand"><p class="o-grand__t">Общий итог</p><b class="o-grand__sum">${money(total())}</b><p class="o-grand__x">${rooms.length} ${plural(rooms.length, 'комната', 'комнаты', 'комнат')}</p></section>` : '';
const find = (id) => rooms.find((r) => r.id === id) || (draft && draft.id === id ? draft : null);

/* 1 · Лента */
function v1() {
  return `${head('Оценка', cnt())}<div class="o-stack">
    ${rooms.map((r) => r === open ? `<section class="f-plate o-room mk-open" style="--rc:${r.c}"><div class="mk-open__hd"><b>${esc(r.name)}</b><small>заполняете сейчас</small></div>${fields(r)}
      <div class="f-btn-row mk-one"><button class="f-btn" onclick="v1save()">Сохранить</button></div></section>` : folded(r, 'v1open')).join('')}
    ${open ? '' : `<p class="mk-sec">${rooms.length ? 'Добавить ещё комнату' : 'Добавьте первую комнату'}</p><div class="mk-chips">${chips(null, 'v1add')}</div>`}
    ${open ? '' : grand()}</div>`;
}
function v1add(n, c) { const r = mk(n, c); rooms.push(r); open = r; draw(); scrollToEl('.mk-open'); }
function v1open(id) { open = find(id); draw(); scrollToEl('.mk-open'); }
function v1save() { const n = open.name; open = null; flash(`✓ ${esc(n)} сохранена`); }

/* 2 · Карточка-шаги */
function v2() {
  const d = draft;
  return `${head('Оценка', cnt())}
    ${rooms.length ? `<div class="mk-pills">${rooms.map((r) => `<span class="mk-pill" style="--rc:${r.c}" onclick="v2edit(${r.id})"><b>${esc(r.name)}</b>${money(sum(r))}</span>`).join('')}</div>` : ''}
    <section class="f-plate mk-card">
      <div class="mk-step${d.type ? ' is-done' : ''}"><i>${d.type ? '✓' : '1'}</i>Что за комната?<span class="mk-num">Комната ${d.edit ? '' : rooms.length + 1}</span>${d.type ? `<button onclick="v2retype()">изменить</button>` : ''}</div>
      ${d.type ? `<div class="mk-sel" style="--rc:${d.c}">${esc(d.name)}<small>${d.edit ? 'правка' : 'новая'}</small></div>` : `<div class="mk-chips">${chips(null, 'v2type')}</div>`}
      ${d.type ? `<div class="mk-step"><i>2</i>Объёмы работ</div>${fields(d)}` : ''}
    </section>
    ${d.type ? (d.edit ? `<div class="f-btn-row mk-one"><button class="f-btn" onclick="v2save(false)">Сохранить</button></div>`
      : `<div class="mk-two"><button class="f-btn" onclick="v2save(false)">Сохранить и итог</button><button class="f-btn" onclick="v2save(true)">Сохранить и следующая</button></div>`) : ''}
    ${!d.type && rooms.length ? grand() : ''}`;
}
function v2type(n, c) { const k = mk(n, c); Object.assign(draft, { type: n, c, name: k.name }); draw(); }
function v2retype() { draft.type = null; draw(); }
function v2edit(id) { const r = rooms.find((x) => x.id === id); draft = r; draft.edit = true; draw(); }
function v2save(next) { const d = draft; if (!d.edit) rooms.push(d); d.edit = false; const n = d.name; draft = { id: ++uid, q: {}, same: '' }; flash(`✓ ${esc(n)} сохранена`); if (!next) window.scrollTo(0, 0); }

/* 3 · Шторка */
function v3() {
  return `${head('Оценка', cnt())}<div class="o-stack">
    ${rooms.length ? rooms.map((r) => folded(r, 'v3edit')).join('') : '<section class="f-plate mk-empty">Комнат пока нет</section>'}
    <button class="mk-big" onclick="v3new()">+ Комната<small>зашли в комнату — нажали</small></button>
    ${grand()}</div>
    ${sheet ? `<div class="mk-shade" onclick="sheet=false;draw()"></div><div class="mk-sheet"><div class="mk-grab"></div>
      <div class="mk-sheet__hd"><span>${draft.type ? esc(draft.name) : 'Какая комната?'}</span><button onclick="sheet=false;draw()">Закрыть</button></div>
      ${draft.edit ? '' : `<div class="mk-scroll">${chips(draft.type, 'v3type')}</div>`}
      ${draft.type ? `<section class="f-plate o-room mk-open" style="--rc:${draft.c}">${fields(draft)}</section><div class="f-btn-row mk-one"><button class="f-btn" onclick="v3save()">Сохранить</button></div>` : '<p class="mk-empty">Выберите комнату — появятся работы</p>'}
    </div>` : ''}`;
}
function v3new() { draft = { id: ++uid, q: {}, same: '' }; sheet = true; draw(); }
function v3type(n, c) { const k = mk(n, c); Object.assign(draft, { type: n, c, name: k.name }); draw(); }
function v3edit(id) { draft = rooms.find((x) => x.id === id); draft.edit = true; sheet = true; draw(); }
function v3save() { const d = draft; if (!d.edit) rooms.push(d); d.edit = false; sheet = false; flash(`✓ ${esc(d.name)} сохранена`); }


/* 4 · Полоска */
let drop = false, fl = 1, tab = null; // tab: id комнаты или 'sum'
function v4() {
  const ring = (t) => D === 3 ? `<span class="mk-ring">${t}</span>` : '';
  const plus = `<button type="button" class="mk-plus${drop ? ' is-open' : ''}" onclick="drop=!drop;draw()" aria-label="Добавить комнату">${D === 3 ? `<span class="mk-ring">${drop ? '×' : '+'}</span>Комната` : '<span>+</span>'}</button>`;
  const tabs = rooms.map((r) => `<button type="button" class="mk-tab${tab === r.id && !drop ? ' is-on' : ''}" style="--rc:${r.c}" onclick="tab=${r.id};drop=false;draw()">${ring(esc(r.name[0]))}${esc(r.name)}<small id="tb-${r.id}">${money(sum(r))}</small></button>`).join('')
    + (rooms.length ? `<button type="button" class="mk-tab mk-tab--sum${tab === 'sum' && !drop ? ' is-on' : ''}" onclick="tab='sum';drop=false;draw()">${ring('∑')}Итог<small>${money(total())}</small></button>` : '');
  const items = [...rooms.map((r) => ({ id: r.id, n: r.name, c: r.c, sm: money(sum(r)), r })), ...(rooms.length ? [{ id: 'sum', n: 'Итог', c: '#e6f2cc', sm: money(total()), sumT: true }] : [])];
  const on = (it) => tab === it.id && !drop;
  const tb = (it, inner) => `<button type="button" class="mk-tab${it.sumT ? ' mk-tab--sum' : ''}${on(it) ? ' is-on' : ''}" style="--rc:${it.c}" onclick="pick('${it.id}')">${inner}</button>`;
  const std = (it) => tb(it, `${ring(it.sumT ? '∑' : esc(it.n[0]))}${esc(it.n)}<small ${it.r ? `id="tb-${it.id}"` : ''}>${it.sm}</small>`);
  let strip;
  if (D === 4) strip = `<div class="mk-strip"><div class="mk-track">${plus}${tabs}</div></div>`;
  else if (D === 7) { const k = items.findIndex(on); const vis = k < 0 ? items.slice(-3) : items.slice(Math.max(0, k - 1), k + 2);
    strip = `<div class="mk-strip">${plus}<div class="mk-car">${vis.map(std).join('')}</div><span class="mk-ctr">${k < 0 ? '' : `${k + 1} / ${items.length}`}</span></div>`; }
  else if (D === 8) { const it = items.find(on);
    strip = `<div class="mk-strip">${plus}<div class="mk-cur8">${it ? `<button class="mk-arr" onclick="swipe(-1)">‹</button><div style="text-align:center"><b>${esc(it.n)}</b><small>${it.sm}</small></div><button class="mk-arr" onclick="swipe(1)">›</button>` : `<span style="color:rgba(237,240,231,.6);padding-left:10px">${drop ? 'Выберите комнату' : 'Комнат пока нет'}</span>`}</div>
      ${items.length ? `<div class="mk-dots">${items.map((x) => `<i class="${on(x) ? 'is-on' : ''}" style="--rc:${x.c}" onclick="pick('${x.id}')"></i>`).join('')}</div>` : ''}</div>`; }
  else if (D === 9) strip = `<div class="mk-strip"><button type="button" class="mk-plus" onclick="drop=!drop;draw()"><span class="mk-ic">${drop ? '×' : '+'}</span>Комната</button>${items.map((it) => tb(it, `<span class="mk-ic">${it.sumT ? '∑' : esc(it.n[0])}</span>${esc(it.n)}`)).join('')}</div>`;
  else if (D === 10) strip = `<div class="mk-strip">${plus}<div class="mk-steps">${items.map((it, k) => tb(it, `<span class="mk-n">${it.sumT ? '∑' : k + 1}</span>${esc(it.n)}`)).join('')}</div></div>`;
  else if (D === 12) { const rs = items.filter((x) => !x.sumT); const sumIt = items.find((x) => x.sumT);
    strip = `<div class="mk-strip">${plus}${rs.length ? `<div class="mk-bar">${rs.map((it) => tb(it, esc(it.n)).replace('style="', `style="--w:${Math.max(1, sum(it.r) / 1000).toFixed(2)};`)).join('')}</div>` : ''}${sumIt ? `<span class="mk-sumbtn">${std(sumIt)}</span>` : ''}</div>`; }
  else if (D === 13) strip = `<div class="mk-strip">${plus}${items.map((it) => { const f = it.r ? SVC.filter(([id]) => parseFloat(it.r.q[id])).length / SVC.length : 1; return tb(it, `${esc(it.n)}<small ${it.r ? `id="tb-${it.id}"` : ''}>${it.sm}</small>${it.r && it.r.saved ? '<span class="mk-ok">✓</span>' : ''}<span class="mk-pr" style="--p:${Math.round(f * 100)}%"></span>`); }).join('')}</div>`;
  else if (D === 14) { const fls = [...new Set(rooms.map((r) => r.fl))].sort();
    strip = `<div class="mk-strip">${plus}${fls.map((f) => `<div class="mk-fl"><small>${f} этаж</small><div>${items.filter((x) => x.r && x.r.fl === f).map(std).join('')}</div></div>`).join('')}${items.filter((x) => x.sumT).map(std).join('')}</div>`; }
  else strip = `<div class="mk-strip">${plus}${items.map(std).join('')}</div>`;
  const floors = `<div class="o-floors">${[1,2,3].map((f) => `<button type="button" class="o-floor${f === fl ? ' is-on' : ''}" onclick="fl=${f};draw()">${f} этаж</button>`).join('')}</div>`;
  const list = D === 4 ? `<div class="o-list mk-list">${TYPES.map(([n, c]) => `<button type="button" class="o-row" onclick="v4add('${n}','${c}')"><span class="o-row__mark" style="background:${c}"></span><span class="o-row__name">${n}</span><span class="o-row__go">›</span></button>`).join('')}</div>` : `<div class="mk-chips">${chips(null, 'v4add')}</div>`;
  const dropHtml = drop ? `<section class="f-plate ${D === 4 ? 'o-sheet ' : ''}mk-drop">${floors}${list}</section>` : '';
  const r = rooms.find((x) => x.id === tab);
  let body = '';
  if (!rooms.length && !drop) body = `<section class="f-plate mk-blank"><b>Комнат пока нет</b>Нажмите «+» и выберите комнату, в которой стоите.</section>`;
  else if (tab === 'sum') body = `<div class="o-stack">${rooms.map((x) => folded(x, 'v4go')).join('')}${grand()}</div>`;
  else if (r) body = `<section class="f-plate o-room mk-open" style="--rc:${r.c}"><div class="mk-open__hd" data-l="${esc(r.name[0])}"><b>${esc(r.name)}</b><small>${r.fl} этаж</small></div>${fields(r)}
      <div class="f-btn-row mk-one"><button class="f-btn" onclick="saveR(${r.id})">Сохранить</button></div></section><p class="mk-swhint">← свайп — соседняя комната →</p>`;
  const inner = drop ? dropHtml : `<div class="mk-swipe${slide ? ' sl-' + slide : ''}">${body}</div>`; slide = '';
  return `<div class="d${D}">${strip}${D === 2 && (rooms.length || drop) ? `<div class="mk-body">${inner}</div>` : inner}</div>`;
}
let slide = '';
function pick(id) { tab = id === 'sum' ? 'sum' : Number(id); drop = false; draw(); }
function saveR(id) { const r = rooms.find((x) => x.id === id); r.saved = true; flash(`✓ ${esc(r.name)} сохранена`); }
function swipe(dir) { const ids = [...rooms.map((r) => r.id), ...(rooms.length ? ['sum'] : [])]; const k = ids.indexOf(tab); if (k < 0) return;
  const n = k + dir; if (n < 0 || n >= ids.length) return; tab = ids[n]; slide = dir > 0 ? 'l' : 'r'; draw();
  requestAnimationFrame(() => { const t = document.querySelector('.mk-tab.is-on'); if (t) t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }); }
let sx = null, sy = null;
document.addEventListener('touchstart', (e) => { if (!e.target.closest('.mk-swipe')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; const dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) swipe(dx < 0 ? 1 : -1); });
function v4add(n, c) { const r = mk(n, c); r.fl = fl; rooms.push(r); tab = r.id; drop = false; draw(); window.scrollTo(0, 0);
  requestAnimationFrame(() => { const s = document.querySelector('.mk-strip'); if (s) s.scrollLeft = s.scrollWidth; }); }
function v4go(id) { tab = id; draw(); window.scrollTo(0, 0); }
function draw() {
  const body = v4();
  document.getElementById('view').innerHTML = `<div class="fig-blobs" aria-hidden="true"><i></i><i></i></div><div class="o-wrap">${vars()}${body}</div>${NAV}` + (note ? `<div class="mk-note">${note}</div>` : '');
}
function scrollToEl(s) { requestAnimationFrame(() => { const e = document.querySelector(s); if (e) window.scrollTo(0, e.getBoundingClientRect().top + window.scrollY - 80); }); }
function setV(n) { V = n; rooms = []; drop = false; tab = null; fl = 1; open = null; sheet = false; draft = { id: ++uid, q: {}, same: '' }; draw(); window.scrollTo(0, 0); }
function setQ(rid, id, v) { const r = find(rid); r.q[id] = v; const p = SVC.find((x) => x[0] === id)[2];
  document.getElementById(`s-${rid}-${id}`).textContent = money((parseFloat(v) || 0) * p); document.getElementById(`t-${rid}`).textContent = money(sum(r)); const tb = document.getElementById(`tb-${rid}`); if (tb) tb.textContent = money(sum(r)); }
function setSame(rid, v) { const r = find(rid); r.same = v; SVC.forEach(([id]) => { const el = document.querySelector(`[data-q="${rid}-${id}"]`); if (el) el.value = v; setQ(rid, id, v); }); }
function flash(h) { note = h; draw(); setTimeout(() => { note = null; draw(); }, 1000); }
V = 4; draft = { id: ++uid, q: {}, same: '' }; draw();
</script></body></html>
