<body class="fig"><div class="app"><main class="view"><div class="fig-blobs"><i></i><i></i></div><div class="o-wrap" id="w"></div></main></div><div id="pop"></div>
<script>
const H = 2.7;
let D = 1;
const NM = ['Стекло', 'Неон', 'Неоморф', 'Material', 'Чертёж', 'Бенто', 'Светлая', 'Градиент', 'Линии', 'Клавиши'];
const DS = ['матовое стекло со свечением цвета комнаты', 'тёмный фон и светящиеся контуры', 'мягкие выпуклые и вдавленные формы из одного материала', 'как Android: тональные заливки, всё скруглено', 'синяя миллиметровка, моноширинный шрифт — как чертёж', 'крупные плитки-блоки, огромные цифры', 'светлая карточка на тёмном фоне, как лист', 'яркий градиент от оранжевого к фиолетовому', 'только тонкие линии и лёгкий шрифт, без заливок', 'настоящие нажимаемые клавиши, как на калькуляторе'];
let L = 4.2, ops = [{ t: 'win', w: 1.5, h: 1.4 }, { t: 'door', w: 0.9, h: 2.1 }], wks = ['prime', 'fliz'], wpick = [], ei = -1, ow = 0, oh = 0;
const WORKS = [['prime', 'Грунтовка', 100, '#5b8def'], ['fliz', 'Поклейка флиз.', 330, '#22c55e'], ['strip', 'Демонтаж обоев', 150, '#ef4444'], ['putty', 'Шпаклёвка', 200, '#a855f7']];
const IC = {
  win: '<svg viewBox="0 0 32 32" fill="none"><rect x="5" y="4" width="22" height="22" rx="2" fill="#8fd3ff" fill-opacity=".25" stroke="#cfeeff" stroke-width="1.8"/><path d="M16 4v22M5 15h22" stroke="#cfeeff" stroke-width="1.6"/><rect x="3" y="26" width="26" height="2.5" rx="1" fill="#cfeeff"/></svg>',
  door: '<svg viewBox="0 0 32 32" fill="none"><rect x="8" y="3" width="16" height="26" rx="1.5" fill="#c8a27a" fill-opacity=".25" stroke="#f1d7b8" stroke-width="1.8"/><circle cx="20" cy="16.5" r="1.5" fill="#f1d7b8"/><path d="M4 29h24" stroke="#f1d7b8" stroke-width="1.8" stroke-linecap="round"/></svg>',
};
const PRE = { win: [1.5, 1.4], door: [0.9, 2.1] };
const f = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
const money = (n) => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const gross = () => L * H; const sumOf = (t) => ops.filter((o) => o.t === t).reduce((a, o) => a + o.w * o.h, 0);
const net = () => Math.max(0, gross() - sumOf('win') - sumOf('door'));
function draw() {
  const tot = wks.reduce((a, k) => a + net() * WORKS.find((x) => x[0] === k)[2], 0);
  const stack = (t) => ops.map((o, i) => o.t === t ? `<div class="op ${t}" onclick="edit(${i})">−${f(o.w * o.h)}</div>` : '').join('');
  document.getElementById('w').innerHTML = `<div class="vs">${NM.map((n, i) => `<button class="${D === i + 1 ? 'is-on' : ''}" onclick="D=${i + 1};draw()">${n}</button>`).join('')}</div><p class="zx"><b>${D}. ${NM[D - 1]}</b> — ${DS[D - 1]}. <button class="rs" onclick="L=0;ops=[];wks=[];draw()">начать заново</button></p>
  <div class="T${D}"><section class="f-plate card"><div class="hd"><b>Стена 1</b><small>высота 2,7 м — одинаковая</small></div>
    <div class="Lin"><label>Длина</label><span class="fld"><input id="L" inputmode="decimal" value="${L ? f(L) : ''}" placeholder="—" oninput="setL(this.value)"><small>м</small></span></div>
    ${!L ? '<div class="empty">Введите длину — появится площадь стены</div>' : `
    <div class="gross"><b>${f(gross())}<small> м²</small></b><span>${f(L)} × ${f(H)}</span></div>
    <div class="cols">
      <div class="sum net">${f(net())}<small> м²</small></div><div class="sum op">${sumOf('win') ? '−' + f(sumOf('win')) : '0'}</div><div class="sum op">${sumOf('door') ? '−' + f(sumOf('door')) : '0'}</div>
      <div class="stack">${wks.map((k, i) => { const [, n, p, c] = WORKS.find((x) => x[0] === k); return `<div class="wk" style="--wc:${c}" onclick="wks.splice(${i},1);draw()">${n}<b>${money(net() * p)}</b></div>`; }).join('')}</div>
      <div class="stack">${stack('win')}</div><div class="stack">${stack('door')}</div>
      <button class="btn w" onclick="openW()">+ работа</button><button class="btn" onclick="add('win')" aria-label="окно">${IC.win}</button><button class="btn" onclick="add('door')" aria-label="дверь">${IC.door}</button>
    </div>
    ${wks.length ? `<div class="total"><span>Стена 1 итого</span><b>${money(tot)}</b></div>` : ''}`}
  </section></div>`;
}
function setL(v) { L = parseFloat(String(v).replace(',', '.')) || 0; draw(); const el = document.getElementById('L'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
function add(t) { ops.push({ t, w: PRE[t][0], h: PRE[t][1] }); draw(); }
function edit(i) { ei = i; ow = ops[i].w; oh = ops[i].h;
  document.getElementById('pop').innerHTML = `<div class="shade" onclick="closePop()"></div><div class="ed"><h3>${IC[ops[i].t]} ${ops[i].t === 'win' ? 'Окно' : 'Дверь'}</h3>
    <div class="sz"><span class="fld"><input inputmode="decimal" value="${f(ow)}" oninput="ow=parseFloat(this.value.replace(',','.'))||0"><small>м</small></span><span>×</span><span class="fld"><input inputmode="decimal" value="${f(oh)}" oninput="oh=parseFloat(this.value.replace(',','.'))||0"><small>м</small></span></div>
    <div class="szl"><span>ширина</span><span></span><span>высота</span></div>
    <div class="r2"><button class="del" onclick="ops.splice(ei,1);closePop();draw()">Удалить</button><button class="f-btn" style="flex:1;height:42px" onclick="ops[ei].w=ow;ops[ei].h=oh;closePop();draw()">ОК</button></div></div>`; }
function openW() { wpick = []; drawW(); }
function drawW() {
  document.getElementById('pop').innerHTML = `<div class="shade" onclick="closePop()"></div><div class="sheet2"><div class="grab"></div><h3>Работы на стене</h3>
    <div class="wl">${WORKS.filter(([k]) => !wks.includes(k)).map(([k, n, p, c]) => `<button class="${wpick.includes(k) ? 'on' : ''}" style="--wc:${c}" onclick="wpick.includes('${k}')?wpick.splice(wpick.indexOf('${k}'),1):wpick.push('${k}');drawW()">${n}<small>${p} ₽/м²</small></button>`).join('')}</div>
    <div class="f-btn-row" style="width:calc(50% + 2.5px);margin:0 auto"><button class="f-btn" onclick="wks.push(...wpick);closePop();draw()">${wpick.length ? 'Добавить · ' + wpick.length : 'Готово'}</button></div></div>`; }
function closePop() { document.getElementById('pop').innerHTML = ''; }
draw();
</script></body></html>
